# USD per 1M tokens. List price verificati a giugno 2026.
# pricing_snapshot in DB records the values used per invocation (PRE_PRD §11.7).
#
# Keys = the STABLE D1 model ids (geography-tier), per ADR-0020. The concrete
# `model_name_api` for each id (e.g. the exact Opus / GPT-mini / Qwen / DeepSeek
# release) is frozen at the seed (D1, PRD riga 3614, M7 step 4); the ids do NOT
# change. tier = absolute market list price (ADR-0020): the 2 priciest = premium
# (usa-premium Opus, cn-premium Qwen), the 2 cheapest = cheap_alt (cn-cheap
# DeepSeek, usa-cheap GPT-mini).
#
# `reasoning` is provisional: set equal to `output` as a conservative upper bound
# (reasoning tokens, where billed separately, priced at the output rate). Re-verify
# per-model reasoning billing at the seed alongside the model_name_api.
models:
  # usa-premium — anthropic (rif. Opus 4.8)
  usa-premium:
    input: 5.00
    output: 25.00
    reasoning: 25.00
  # usa-cheap — openai (rif. GPT-5.4 mini)
  usa-cheap:
    input: 0.75
    output: 6.00
    reasoning: 6.00
  # cn-premium — qwen (rif. Qwen3.7-Max, list price)
  cn-premium:
    input: 2.50
    output: 7.50
    reasoning: 7.50
  # cn-cheap — deepseek (rif. DeepSeek V4 Pro)
  cn-cheap:
    input: 1.74
    output: 3.48
    reasoning: 3.48
