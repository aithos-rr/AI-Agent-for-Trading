[project]
name = "aiat"
version = "0.1.0"
description = "AI Trading Agent V2 — Thesis Edition"
requires-python = ">=3.12"
dependencies = [
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "apscheduler<4",
    "hyperliquid-python-sdk",
    "httpx",
    "structlog",
    "pandas",
    "numpy",
    "pandas-ta",
    "tenacity",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiat"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-postgresql",
    "vcrpy",
    "pytest-recording",
    "ruff",
    "mypy",
    "import-linter",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "hyperliquid.*",
    "pandas_ta.*",
    "vcr.*",
    "pytest_postgresql.*",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "invariant: marks tests that verify a PRD invariant",
    "testnet: marks tests that require a real Hyperliquid testnet wallet",
    "vcr: marks tests that use VCR cassettes",
]

[tool.importlinter]
root_package = "aiat"

[[tool.importlinter.contracts]]
name = "domain is independent"
type = "forbidden"
source_modules = ["aiat.domain"]
forbidden_modules = [
    "aiat.db",
    "aiat.llm",
    "aiat.context",
    "aiat.execution",
    "aiat.orchestration",
]
