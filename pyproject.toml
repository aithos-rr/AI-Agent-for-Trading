[project]
name = "aiat"
version = "0.1.0"
description = "AI Trading Agent V2 — Thesis Edition"
requires-python = ">=3.12"
dependencies = [
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "apscheduler<4",
    "hyperliquid-python-sdk",
    "httpx",
    "structlog",
    "pandas",
    "numpy",
    "pandas-ta",
    "tenacity",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiat"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-postgresql",
    "vcrpy",
    "ruff",
    "mypy",
    "import-linter",
]
