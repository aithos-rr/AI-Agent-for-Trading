esistance", "sentiment.news_polarity", "sentiment.fear_greed", "sentiment.market_panic", "onchain.funding_rate_extreme", "onchain.open_interest_shift", "onchain.liquidation_cascade", "market.volatility_regime", "market.volume_anomaly", "market.basis_perp_spot", "portfolio.exposure_high", "portfolio.unrealized_pnl", "portfolio.position_aging"], "type": "string"}, "maxItems": 8, "title": "Action Key Signals", "type": "array"}}, "required": ["symbol", "side", "leverage", "size_pct", "stop_loss_pct", "take_profit_pct", "entry_type", "limit_price", "confidence", "time_horizon_min", "action_reasoning", "action_key_signals"], "title": "ActionDecision", "type": "object"}, "EntryType": {"enum": ["market", "limit", "none"], "title": "EntryType", "type": "string"}, "Side": {"enum": ["LONG", "SHORT", "FLAT", "HOLD"], "title": "Side", "type": "string"}}, "additionalProperties": false, "description": "Output completo del modello per UN tick portfolio-level (RESEARCH \u00a71.0).", "properties": {"portfolio_reasoning": {"maxLength": 4000, "minLength": 50, "title": "Portfolio Reasoning", "type": "string"}, "risk_assessment": {"maxLength": 2000, "minLength": 30, "title": "Risk Assessment", "type": "string"}, "portfolio_confidence": {"anyOf": [{"maximum": 1.0, "minimum": 0.0, "type": "number"}, {"pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d{0,4}0*$", "type": "string"}, {"type": "null"}], "title": "Portfolio Confidence"}, "actions": {"description": "Exactly 3 actions, one per symbol (BTC, ETH, SOL), in any order.", "items": {"$ref": "#/$defs/ActionDecision"}, "maxItems": 3, "minItems": 3, "title": "Actions", "type": "array"}}, "required": ["portfolio_reasoning", "risk_assessment", "portfolio_confidence", "actions"], "title": "TradeDecision", "type": "object"}, "name": "TradeDecision", "strict": true}}, "stream": false, "temperature": 0.7}'
